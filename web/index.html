<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <script>
      (() => {
        const saved = localStorage.getItem("awesome-morphe-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: light)")
          .matches
          ? "light"
          : "dark";
        const theme = saved || systemTheme;
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awesome Morphe Website</title>
    <meta
      name="description"
      content="Explore all patch bundles from the Morphe community."
    />
    <link rel="canonical" href="https://awesome-morphe.vercel.app/" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#18181b"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="Awesome Morphe Website" />
    <meta
      property="og:description"
      content="Explore all patch bundles from the Morphe community."
    />
    <meta
      property="og:image"
      content="https://awesome-morphe.vercel.app/assets/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Awesome Morphe Website" />
    <meta property="og:url" content="https://awesome-morphe.vercel.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Awesome Morphe Website" />
    <meta
      name="twitter:description"
      content="Explore all patch bundles from the Morphe community."
    />
    <meta
      name="twitter:image"
      content="https://awesome-morphe.vercel.app/assets/og-image.png"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Awesome Morphe Website",
        "url": "https://awesome-morphe.vercel.app/",
        "description": "Explore all patch bundles from the Morphe community."
      }
    </script>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-80G574QRZ0"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-80G574QRZ0");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
