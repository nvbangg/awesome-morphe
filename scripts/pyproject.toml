[project]
name = "awesome-morphe-scripts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "google-play-scraper>=1.2.7",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.17.1"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP", "ASYNC", "A", "C4", "PIE", "RET", "SIM", "ARG", "PTH", "RUF"]
ignore = ["E501"]
