[project]
name = "awesome-morphe-scripts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "google-play-scraper>=1.2.7",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]

[tool.ruff.lint]
extend-select = ["A", "ARG", "B", "E4", "E7", "F", "N", "PTH"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
