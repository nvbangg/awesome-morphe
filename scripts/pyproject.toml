[project]
name = "awesome-morphe"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "google-play-scraper>=1.2.7",
    "httpx2>=2.16.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.101",
]

[tool.uv]
required-version = ">=0.13.0"

[tool.ruff]
line-length = 120

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
