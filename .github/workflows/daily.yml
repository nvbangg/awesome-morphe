name: Daily
run-name: ${{ inputs.mode == 'weekly' && 'Sync (weekly)' || 'Sync (daily)' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly

concurrency:
  group: ci
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Discover repositories
        run: python scripts/discover.py

      - name: Fetch new bundles
        id: fetch
        run: |
          python scripts/fetch.py --image

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            if [ -s scripts/bundle-parser/updated_files.txt ]; then
              echo "need_java=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup Java environment
        if: steps.fetch.outputs.need_java == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Parse bundles
        if: steps.fetch.outputs.changed == 'true'
        run: python scripts/parse.py

      - name: Update bundles data
        run: |
          pip install -e scripts/
          python scripts/update.py --${{ inputs.mode }}

      - name: Generate What's New
        id: whats_new
        run: python scripts/whats_new.py

      - name: Commit and push changes
        if: steps.whats_new.outputs.success == 'true'
        id: commit
        run: |
          TODAY=$(date -u -d '+1 hour' +'%Y-%m-%d')
          WEEK=$(date -u -d '+1 hour' +'%G-W%V')
          jq --arg d "$TODAY" --arg w "$WEEK" --arg m "${{ inputs.mode }}" \
            '.lastDaily = $d | if $m == "weekly" then .lastWeek = $w else . end' data/ci.json > data/ci.tmp && mv data/ci.tmp data/ci.json

          git add data/ web/public/
          if ! git diff --staged --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            COMMIT_MSG="Update history (${{ inputs.mode == 'weekly' && 'weekly ' || '' }}${TODAY})"
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:main
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        if: steps.commit.outputs.changed == 'true' && hashFiles('scripts/temp/whats-new.md') != ''
        env:
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python scripts/telegram.py

      - name: Cleanup old workflow runs
        run: |
          gh run list -L 500 --json databaseId -q '.[].databaseId' | tail -n +191 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :
