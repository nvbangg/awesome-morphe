name: Sync pipeline
run-name: ${{ inputs.mode == 'normal' && 'Sync' || format('Sync ({0})', inputs.mode) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select sync mode"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - daily

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      PYTHONUNBUFFERED: "1" # Stream Python logs immediately
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Prepare sync
        id: mode
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "$MODE" != "normal" ]; then
            echo "args=--$MODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python environment
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: scripts
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --project scripts --locked --no-dev

      - name: Setup Java environment
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Sync data
        id: sync
        working-directory: scripts
        run: uv run --no-sync main.py ${{ steps.mode.outputs.args }}

      - name: Commit and push changes
        if: steps.sync.outputs.updated == 'true'
        id: commit
        env:
          TODAY: ${{ steps.mode.outputs.today }}
        run: |
          COMMIT_MSG="Sync bundles"
          if [ "$MODE" != "normal" ]; then
            jq --arg d "$TODAY" '.lastDaily = $d' data/state.json > data/state.tmp && mv data/state.tmp data/state.json
            COMMIT_MSG="Update history (${TODAY})"
          fi
          git add data/ web/public/
          if ! git diff --staged --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "$COMMIT_MSG"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        if: inputs.mode != 'normal' && steps.commit.outputs.changed == 'true' && hashFiles('scripts/temp/whats-new.md') != ''
        env:
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        working-directory: scripts
        run: uv run --no-sync main.py telegram

      - name: Cleanup old workflow runs
        if: inputs.mode != 'normal'
        run: |
          gh run list -L 500 --json databaseId -q '.[].databaseId' | tail -n +201 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :
