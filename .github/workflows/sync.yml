name: Sync pipeline
run-name: ${{ inputs.mode == 'normal' && 'Sync' || format('Sync ({0})', inputs.mode) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select sync mode"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - daily
          - weekly

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      PYTHONUNBUFFERED: "1" # Stream Python logs immediately
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Prepare sync
        id: mode
        run: |
          read -r TODAY WEEK <<< "$(date -u +'%Y-%m-%d %G-W%V')"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          if [ "$MODE" != "normal" ]; then
            echo "args=--$MODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python environment
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: scripts
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --project scripts --locked --no-dev

      - name: Discover bundles and projects
        run: uv run --project scripts --no-sync scripts/discover.py ${{ steps.mode.outputs.args }}

      - name: Setup Java environment
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Fetch new bundles
        run: uv run --project scripts --no-sync scripts/fetch.py ${{ steps.mode.outputs.args }}

      - name: Check data changes
        if: inputs.mode == 'normal'
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- data/ web/public/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update bundles data
        if: inputs.mode != 'normal' || steps.changes.outputs.changed == 'true'
        id: update
        run: uv run --project scripts --no-sync scripts/update.py ${{ steps.mode.outputs.args }}

      - name: Commit and push changes
        if: steps.update.outcome == 'success'
        id: commit
        env:
          TODAY: ${{ steps.mode.outputs.today }}
          WEEK: ${{ steps.mode.outputs.week }}
        run: |
          COMMIT_MSG="Sync bundles"
          if [ "$MODE" != "normal" ]; then
            jq --arg d "$TODAY" --arg w "$WEEK" --arg m "$MODE" \
              '.lastDaily = $d | if $m == "weekly" then .lastWeek = $w else . end' data/update-state.json > data/update-state.tmp && mv data/update-state.tmp data/update-state.json
            COMMIT_MSG="Update history (${TODAY})"
            if [ "$MODE" = "weekly" ]; then
              COMMIT_MSG="Update history (weekly ${TODAY})"
            fi
          fi
          git add data/ web/public/
          if ! git diff --staged --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "$COMMIT_MSG"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        if: inputs.mode != 'normal' && steps.commit.outputs.changed == 'true' && hashFiles('scripts/temp/whats-new.md') != ''
        env:
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: uv run --project scripts --no-sync scripts/telegram.py

      - name: Cleanup old workflow runs
        if: inputs.mode != 'normal'
        run: |
          gh run list -L 500 --json databaseId -q '.[].databaseId' | tail -n +201 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :
