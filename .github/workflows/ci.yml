name: Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check schedule
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=$(jq -r \
              --arg today "$(date -u -d '+1 hour' +'%Y-%m-%d')" \
              --arg week "$(date -u -d '+1 hour' +'%G-W%V')" '
              if .lastWeek != $week then "weekly"
              elif .lastDaily != $today then "daily"
              else empty end' data/ci.json 2>/dev/null)

            if [ -n "$MODE" ]; then
              gh workflow run daily.yml -f mode="$MODE"
              echo "::notice title=Workflow Triggered::Dispatched daily.yml with mode=$MODE"
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Discover repositories
        if: steps.check.outputs.skip != 'true'
        run: python scripts/discover.py

      - name: Fetch new bundles
        if: steps.check.outputs.skip != 'true'
        id: fetch
        run: |
          python scripts/fetch.py

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            if [ -s scripts/bundle-parser/updated_files.txt ]; then
              echo "need_java=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup Java environment
        if: steps.fetch.outputs.need_java == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Parse bundles
        if: steps.fetch.outputs.changed == 'true'
        run: python scripts/parse.py

      - name: Update bundles data
        if: steps.fetch.outputs.changed == 'true'
        run: |
          pip install -e scripts/
          python scripts/update.py

      - name: Commit and push changes
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git add data/ web/public/
          if ! git diff --staged --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync bundles"
            git push origin HEAD:main
          fi
