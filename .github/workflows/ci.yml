name: Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select mode"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - daily
          - weekly

concurrency:
  group: ci
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Select sync mode
        id: mode
        env:
          MODE: ${{ inputs.mode || 'default' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=$(jq -r \
              --arg today "$(date -u -d '+1 hour' +'%Y-%m-%d')" \
              --arg week "$(date -u -d '+1 hour' +'%G-W%V')" '
              if .lastWeek != $week then "weekly"
              elif .lastDaily != $today then "daily"
              else "default" end' data/ci.json)
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" != "default" ]; then
            echo "args=--$MODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        run: python -m pip install -e scripts/

      - name: Discover bundles and projects
        run: python scripts/discover.py ${{ steps.mode.outputs.args }}

      - name: Setup Java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Fetch new bundles
        run: python scripts/fetch.py ${{ steps.mode.outputs.args }}

      - name: Check data changes
        if: steps.mode.outputs.mode == 'default'
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- data/ web/public/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Update bundles data
        if: steps.mode.outputs.mode != 'default' || steps.changes.outputs.changed == 'true'
        id: update
        run: python scripts/update.py ${{ steps.mode.outputs.args }}

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true' || steps.update.outputs.success == 'true'
        id: commit
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          COMMIT_MSG="Sync bundles"
          if [ "$MODE" != "default" ]; then
            TODAY=$(date -u -d '+1 hour' +'%Y-%m-%d')
            WEEK=$(date -u -d '+1 hour' +'%G-W%V')
            jq --arg d "$TODAY" --arg w "$WEEK" --arg m "$MODE" \
              '.lastDaily = $d | if $m == "weekly" then .lastWeek = $w else . end' data/ci.json > data/ci.tmp && mv data/ci.tmp data/ci.json
            COMMIT_MSG="Update history (${TODAY})"
            if [ "$MODE" = "weekly" ]; then
              COMMIT_MSG="Update history (weekly ${TODAY})"
            fi
          fi
          git add data/ web/public/
          if ! git diff --staged --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        if: steps.mode.outputs.mode != 'default' && steps.commit.outputs.changed == 'true' && hashFiles('scripts/temp/whats-new.md') != ''
        env:
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python scripts/telegram.py

      - name: Cleanup old workflow runs
        if: steps.mode.outputs.mode != 'default'
        run: |
          gh run list -L 500 --json databaseId -q '.[].databaseId' | tail -n +191 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :
