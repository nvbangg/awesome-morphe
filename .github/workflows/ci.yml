name: CI

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 * * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Select and trigger sync
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          MODE=$(jq -r \
            --arg today "$TODAY" '
            if .lastDaily != $today then "daily"
            else "normal" end' data/state.json)
          gh workflow run sync.yml --ref "$GITHUB_REF_NAME" -f mode="$MODE"
          echo "::notice::Dispatched sync.yml (mode: $MODE)"
