name: Bundle Request
description: Request to add or remove a bundle source
title: "[Bundle Request] "
labels: ["bundle-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a request! Use this template to add or remove a bundle source.
  - type: dropdown
    id: action
    attributes:
      label: Action
      description: Purpose of this request
      options:
        - Add Bundle
        - Remove Bundle
      default: 0
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      description: The GitHub or GitLab URL of the bundle source
      placeholder: https://github.com/username/morphe-patches
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the bundle or the reason for removal
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation (Add Bundle only)
      options:
        - label: The bundle is compatible with Morphe
        - label: The repository contains a valid patches-bundle.json
